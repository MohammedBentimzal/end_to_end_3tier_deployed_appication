#role for the backend whatever the input value : GIN or DJANGO 
# each play is for a tier in this app we have only the backend so we use one play

#is a module = small specific task 
# the input variables are ansible-playbook -i inventory.aws_ec2.yaml site.yaml \
#-e "backend_type=gin db_engine=mongo env_name=alice-dev"
#firewalls :8000 tcp , 8080 tcp , 22 tcp , egress to all

- name: deny any incoming traffic by default
  community.general.ufw:
    direction: incoming
    default: deny

- name: allow outgoing by default
  community.general.ufw:
    direction: outgoing
    default: allow

- name: allow traffic comming from nginx into the 8000 or 8080 port
  community.general.ufw:
    rule: allow
    port: "{{ '8000' if backend_type == 'django' else '8080' }}"
    proto: tcp
    src: "{{ hostvars[groups['nginx'] | intersect(groups[env_name]) | first]['ansible_host'] }}"
    direction: in

- name: allow ssh traffic comming from the bastion
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
    src: "{{ hostvars[groups['bastion'] | intersect(groups[env_name]) | first]['ansible_host'] }}"
    direction: in

- name: enable UFW
  community.general.ufw:
    state: enabled

#- name: load variables
# ansible.builtin.include_vars:
 # file: "{{ playbook_dir }}/vars/{{db_engine}}.yaml"

- name: Load database secret
  ansible.builtin.set_fact:
    database_secrets: "{{lookup('amazon.aws.secretsmanager_secret',db_engine,region='us-east-1') | from_json }}" #.secet is the retun value fom secret manage module

- name: pull the image from docker hub
  community.docker.docker_image_pull:
    name: >-    #{%- i add the - to romove additional spacebecauseit creates problems
            {%- if backend_type == "django" and db_engine == "mongo" -%}   
              mohammedbentimzal/bentimzalhub:djangomongoimg
            {%- elif backend_type == "django" -%}   
              mohammedbentimzal/bentimzalhub:djangoimg
            {%- else -%}
              mohammedbentimzal/bentimzalhub:ginimg 
            {%- endif -%}

- name: demarrer container
  community.docker.docker_container:
    name: "{{backend_type}}"
    image: >-
            {%- if backend_type == "django" and db_engine == "mongo" -%}   
              mohammedbentimzal/bentimzalhub:djangomongoimg
            {%- elif backend_type == "django" -%}   
              mohammedbentimzal/bentimzalhub:djangoimg
            {%- else -%}
              mohammedbentimzal/bentimzalhub:ginimg 
            {%- endif -%}
    state: started 
    published_ports: 
      - >-
          {%- if backend_type == "django" -%}
          8000:8000
          {%- else -%}
          8080:8080
          {%- endif -%}
    env:
      DB_ENGINE: >-
                   {%- if backend_type == "django" -%}
                      {%- if db_engine == "mysql" -%}
                          django.db.backends.mysql
                      {%- elif db_engine == "postgres" -%}
                          django.db.backends.postgresql
                      {%- endif -%}
                   {%- else -%}
                      {{db_engine}}
                   {%- endif -%}   
      DB_NAME: "{{database_secrets.DB_NAME}}" 
      DB_USER: "{{database_secrets.DB_USER}}"  
      DB_HOST: "{{database_secrets.DB_HOST}}" 
      DB_PASSWORD: "{{database_secrets.DB_PASSWORD}}"  
      DB_PORT: "{{database_secrets.DB_PORT}}"
      
