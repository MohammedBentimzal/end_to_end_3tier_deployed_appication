#we need to createthe destintation directory inside of ec2
#configure the firewalls in the host 
#accept : tcp/port 80 ,tcp/port 443 , tcp/port 22 ssh for my ip , egress to anyone  
- name : deny any incoming traffic by default 
  community.general.ufw :
    direction : incoming
    default : deny 

- name : allow outgoing by default 
  community.general.ufw :
    direction : outgoing
    default : allow 

- name: allow all trafic comming from port 80
  community.general.ufw :
    rule: allow
    port : '80'
    proto : tcp
    src : any
    direction : in

- name: allow all trafic comming from port 443
  community.general.ufw :
    rule: allow
    port : '443'
    proto : tcp
    src : any
    direction : in
  
- name: allow ssh 
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
    direction: in

- name: enable UFW
  community.general.ufw:
    state: enabled
   
    
- name: Create nginx config directory
  ansible.builtin.file:
    path: /opt/nginx
    state: directory
    mode: "0755"
#src already point on templates 
#the file generated by the template and used in volumes 
 #the variables that we determine in the template 
- name: get nginx config template file 
  ansible.builtin.template:
    src: nginxconfig.j2              
    dest: /opt/nginx/default.conf 
  vars:
    backend_port: >-
                    {%- if backend_type == "django" -%}
                    8000
                    {%- else -%}
                    8080
                    {%- endif -%}

- name: demarrer container
  community.docker.docker_container:
    name: nginx_container
    image: nginx:latest
    state: started
    published_ports:
      - "80:80"    #host port (EC2) : container port
    #volumes : are the ones that makes you pass files into the container 
    volumes:
      - "/opt/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"    #myconffile:containerdefaultfile:readonly
