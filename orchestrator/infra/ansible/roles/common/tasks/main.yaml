#common tasks : installer docker , demarrer docker , installer python sdk , harden Os + firewalls 

- name: installer docker
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true

- name: demaarrer docker 
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started 

- name: Install Docker SDK for Python
  ansible.builtin.apt:
    name: python3-docker
    state: present 