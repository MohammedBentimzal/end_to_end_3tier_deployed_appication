- name: pull nginx image from repo and run the container 
  hosts: database
  become: true

  tasks:
    #is a module = small specific task 
    - name: installer docker
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true

    - name: demaarrer docker 
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started 

    # we need the python sdk without it we cannot pull or run commands 

    - name: Install Docker SDK for Python
      ansible.builtin.apt:
        name: python3-docker
        state: present

    - name: demarrer container
      community.docker.docker_container:
        name: postgres_container
        image: postgres:latest
        state: started 
        published_ports:
          - "5432:5432"    #host port (EC2) : container port 
          #we need to add the variables that will connect the app.py to the db
        env:
          POSTGRES_USER: "...."
          POSTGRES_PASSWORD: "...."
          POSTGRES_DB: "...."
